<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* the cover slides right one character at a time to "type" the command */
    .cover { animation: type 1.8s steps(45) 0.8s both; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(440px); } }
    .output { animation: show 0.01s 2.9s both; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .output { animation: none; }
      .cover { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="247" rx="12" fill="#1e1e2e" stroke="#313244"/>
  <path d="M12.5 0.5h855a12 12 0 0 1 12 12v22.5h-879v-22.5a12 12 0 0 1 12-12z" fill="#181825"/>
  <line x1="0.5" y1="35" x2="879.5" y2="35" stroke="#313244"/>
  <circle cx="22" cy="18" r="6" fill="#f38ba8"/><circle cx="42" cy="18" r="6" fill="#f9e2af"/><circle cx="62" cy="18" r="6" fill="#a6e3a1"/>
  <text x="440" y="23" text-anchor="middle" font-size="13" fill="#6c7086">mifwar — tmux</text>

  <text x="28" y="72"><tspan fill="#89b4fa">~</tspan><tspan fill="#cba6f7"> ❯ </tspan><tspan fill="#cdd6f4">whoami</tspan></text>
  <text x="28" y="100" font-size="22" font-weight="700" fill="#cdd6f4">Miftahul Anwar</text>
  <text x="28" y="126" fill="#a6adc8">software engineer <tspan fill="#6c7086">·</tspan> Zenius Education <tspan fill="#6c7086">·</tspan> Indonesia</text>
  <text x="28" y="150" fill="#6c7086"><tspan fill="#a6adc8">6,168</tspan> contributions in the last year · on GitHub since <tspan fill="#a6adc8">2018</tspan></text>

  <text x="28" y="190"><tspan fill="#89b4fa">~</tspan><tspan fill="#cba6f7"> ❯ </tspan></text>
  <text x="64" y="190" fill="#cdd6f4">crew up profile lead=claude impl=codex rev=pi</text>
  <rect class="cover" x="62" y="172" width="440" height="24" fill="#1e1e2e"/>
  <text class="output" x="28" y="216" fill="#a6adc8"><tspan fill="#a6e3a1">●</tspan> claude plans  <tspan fill="#a6e3a1">●</tspan> codex builds  <tspan fill="#f9e2af">●</tspan> pi reviews  <tspan fill="#6c7086">· three agents, one tmux window</tspan><tspan class="cursor" fill="#cdd6f4"> ▍</tspan></text>
</svg>
