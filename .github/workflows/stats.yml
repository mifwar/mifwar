name: Refresh header stats

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate header
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r total since < <(gh api graphql -f query='
            { user(login: "mifwar") {
                createdAt
                contributionsCollection { contributionCalendar { totalContributions } }
            } }' --jq '"\(.data.user.contributionsCollection.contributionCalendar.totalContributions) \(.data.user.createdAt[0:4])"')
          python3 scripts/header.py assets "$total" "$since"

      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh header stats"
          git push
